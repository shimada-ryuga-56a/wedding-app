name: CI

on:
  push:
    branches: [main]
  pull_request:

# このワークフローはコードを読むだけなので、書き込みの権限は渡さない
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        if: ${{ !cancelled() }}

      - name: Typecheck
        run: pnpm typecheck
        if: ${{ !cancelled() }}

      - name: Unit test
        run: pnpm test
        if: ${{ !cancelled() }}

  # フェーズ3で e2e を書く
